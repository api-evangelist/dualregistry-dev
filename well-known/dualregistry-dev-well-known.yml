  saved: the x402 discovery document at /.well-known/x402 (x402Version 1, payTo wallet, one
  priced resource, accepts[] for eip155:8453 — the provider's vercel.json rewrites it from
  x402.json) and the A2A agent card at /.well-known/agent-card.json (registered in a2a/, byte
  sha256 a38afd3f… on all three hosts and at the root alias /agent-card.json). Also saved from the
  root, because the ai-plugin names it: /mcp.json, a six-entry tool MANIFEST (name, method, url)
  and not an MCP server (see mcp/). NOT served on any host: security.txt (RFC 9116), OIDC
  discovery, RFC 8414 / RFC 9728 OAuth metadata (there is no OAuth anywhere on this API — the
  paywall is x402), RFC 9727 api-catalog, UCP/ACP, AAuth, the legacy /.well-known/agent.json, and
  any apis.json / apis.yml index. Every miss is a real Vercel 404 (text/plain "The page could not
  be found NOT_FOUND", 79 bytes); the negative control 404s the same way, so the 200s above are
  genuine documents, not a catch-all.
