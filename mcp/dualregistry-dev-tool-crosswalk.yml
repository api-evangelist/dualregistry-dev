checked: '2026-09-19'
summary: >-
  There is no live MCP server and no GraphQL, so this crosswalk binds the two agent-facing tool
  lists the provider DOES publish — the mcp.json manifest and the agent card's skills — to the
  served OpenAPI. Six of six manifest tools and 11 of 11 card skills name a real HTTP surface; 5
  manifest tools and 7 card skills bind to one of the 7 spec operations, and the rest (feedback,
  counter_fee, fill_hint, buy_unlock's unlock step) are documented HTTP endpoints the spec omits.
  The gap runs the other way too: the spec is a stub, so every tool's real input contract comes
  from llms.txt, the 402 body, the fee-quote JSON Schema and the 405 notes rather than from the
  contract. Confidence is high where the tool names the same path the operation declares; medium
  where the binding rests on the docs' description of an alias.
