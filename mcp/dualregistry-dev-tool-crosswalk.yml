    note: 'GET /api/echo?echo_id=…; 402 x402 invoice unless X-PAYMENT-TX + X-PAYMENT-CHAIN (or ?tx_hash=&chain=, or credit_token) accompany it; ?preview=1 is the free redacted form. The card also documents /*.echo.json and /preview/{id}, which vercel.json/middleware rewrite to /api/echo.'
