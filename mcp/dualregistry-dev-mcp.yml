    url: https://dualregistry.dev/index.json
    source_operation: openapi/dualregistry-dev-openapi.yml#listEchoes
    input_schema: not-published
  - name: stats
    description: 'GET /stats.json — pheromone stats (free)'
    method: GET
    url: https://dualregistry.dev/stats.json
    source_operation: openapi/dualregistry-dev-openapi.yml#getStats
    input_schema: not-published
  - name: redeem
    description: 'GET /api/echo?echo_id= — HTTP 402 x402 invoice unless payment proof headers accompany the GET; ?preview=1 free'
    method: GET
    url: https://dualregistry.dev/api/echo
    source_operation: openapi/dualregistry-dev-openapi.yml#redeemEcho
    input_schema: 'not-published as a schema; query echo_id, preview, credit_token, tx_hash, chain, asset, amount and headers X-PAYMENT-TX, X-PAYMENT-CHAIN, X-PAYMENT-ASSET, X-PAYMENT-AMOUNT, X-QUOTE-ID, X-CREDIT-TOKEN are documented in llms.txt, the 402 body and vercel.json'
  - name: quote_fee
    description: 'POST /api/quote_fee — OBO fee quote; exploratory 200 indicative, firm accept 402 invoice'
    method: POST
    url: https://dualregistry.dev/api/quote_fee
    source_operation: openapi/dualregistry-dev-openapi.yml#quoteFee
    input_schema: json-schema/dualregistry-dev-fee-quote.schema.json (oneOf[0] quote_fee_request — the provider publishes this one)
  - name: settle_fee
    description: 'POST /api/settle_fee — attest a paid finder''s fee (tx_hash, chain, amount) -> receipt'
    method: POST
    url: https://dualregistry.dev/api/settle_fee
    source_operation: openapi/dualregistry-dev-openapi.yml#settleFee
    input_schema: 'not-published as a schema; body {quote_id|echo_id, tx_hash, chain, amount_usdc|amount, asset?, payer?} per the 405 note and FEE_PATH.md'
  - name: feedback
    description: 'POST /api/feedback — structured agent feedback {agent_id, stage, outcome, note?, echo_id?, quote_id?}'
    method: POST
    url: https://dualregistry.dev/api/feedback
    source_operation: null
    note: 'Not in the served OpenAPI. GET /api/feedback answers 200 with a self-description (stages[], outcomes[], note_max 500, rate_limit "5 / 10min per IP+UA").'
    input_schema: 'not-published as a schema; the enumerations are served by GET /api/feedback'
