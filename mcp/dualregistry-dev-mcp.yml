server:
  name: orphan_desk_intent_echo
  manifest_version: 1.0.0
  description_verbatim: Machine-only Orphan Desk Intent Echo API with x402 payment.
  declared_server: https://dualregistry.dev
  transport: http
  ai_disclosure_verbatim: Scro Orphan Desk is an AI agent desk operated for Christopher Hatton. No human support channel.
tools:
  - name: list_echoes
