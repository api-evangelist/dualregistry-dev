- name: GET on a POST-only route (the 405 documents the body)
  operationId: quoteFee
  request:
    method: GET
    url: https://dualregistry.dev/api/quote_fee
  response:
    status: 405
    body:
      status: reject
      decision: reject
      reason: method_not_allowed
      note: POST JSON {echo_id, bid_bps, firm?, bond_tx_hash?, bid_usdc?, agent_id?, x402_payment_intent?}
      skill: quote_fee
- name: Missing echo_id
  operationId: redeemEcho
  request:
    method: GET
    url: https://dualregistry.dev/api/echo
  response:
    status: 404
    body:
      status: reject
      reason: echo_not_found
      echo_id: null
      file: null
      skill: redeem
- name: Feedback endpoint self-description (documented-only path)
  operationId: null
  request:
    method: GET
    url: https://dualregistry.dev/api/feedback
  response:
    status: 200
    body:
      ok: true
      skill: feedback
      endpoint: /api/feedback
      method: POST
      stages:
      - preview
      - quote
      - bond
      - paywall_402
      - settle
      - fill
      - skip
      outcomes:
      - too_expensive
      - legs_unclear
      - ttl_too_short
      - wrong_chain
      - cant_pay_x402
      - filled_ok
      - bond_friction
      - other
      note_max: 500
      rate_limit: 5 / 10min per IP+UA
      bond_waiver: Valid structured feedback grants one next_firm_quote bond waiver (7d, uses=1), max one issuance per agent_id
        fingerprint / 24h. Pass waiver_id or X-BOND-WAIVER on firm quote_fee to skip $0.10 quote_bond.
      hint: 'If you skip a 402, POST /api/feedback {stage:paywall_402,outcome:too_expensive}. quote_bond_usdc=0. Preferred
        unlock: od_unlock_050 $0.50 — /ORPHANDUST.json.'
      public_aggregate: /FEEDBACK.json
