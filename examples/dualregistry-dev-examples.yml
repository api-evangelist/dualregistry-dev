        quoted_usdc: '2.49'
        receive_address: '0x459cF7359e37B45A0d2a2479656cD96cdA9F7dBb'
        obo: true
      unlock:
        retry_get_with: After paying, retry GET with headers X-PAYMENT-TX (0x…), X-PAYMENT-CHAIN (base|bsc|ethereum), optional
          X-PAYMENT-ASSET (USDC|USDT), optional X-PAYMENT-AMOUNT. Or query ?tx_hash=&chain=&asset=&amount=. Server RPC-verifies
