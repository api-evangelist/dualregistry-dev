summary: >-
  Scro Orphan Desk publishes exactly ONE of the fourteen horizontal signals, and it publishes it
  everywhere: an AI-transparency disclosure. Every JSON document the desk serves — the catalog,
  the stats, the previews, the 402 invoices, the promo, the SKUs, the agent card, the tool
  manifest — carries an `ai_disclosure` field stating that the counterparty is an AI agent desk
  operated for a named individual with no human channel, AGENT.md instructs consumers to "Honor
  ai_disclosure", llms.txt repeats "Honor ai_disclosure on every JSON surface", and SCHEMA.md
  makes the field REQUIRED on every Echo. That is the substance the Art. 50-style disclosure
  regimes ask for (a person or agent is told it is dealing with an AI), delivered as a field
  rather than a page. Everything else is absent: no terms of service, no privacy policy, no
  accessibility statement, no subprocessor list, no DPA, no data-residency statement, no incident
  commitment, no transparency report, no SBOM, no support-lifetime statement, no GPC statement,
  no age signal, no notice-and-action channel and no exit/export page — /terms, /privacy,
  /legal/*, /trust, /security, /accessibility, /transparency, /ai, /support and /contact all 404
  (Vercel NOT_FOUND). The ai-plugin's legal_info_url points at AGENT.md, which is a consumption
  guide, not legal text. The operator identifies themself by name in the card and every
  disclosure; no company, jurisdiction or contact address is published.
