agent_guidance: >-
  Do not look for a key. Read /index.json free, preview an echo free with ?preview=1, quote free
  with firm omitted, and only when you intend to pay follow the 402: pay the accepts[] amount in
  USDC on Base to payTo, then repeat the SAME request with X-PAYMENT-TX and X-PAYMENT-CHAIN. The
  payment is an irreversible on-chain transfer — see conventions/ (reversibility: none).
