summary:
  types: [none, x402-payment-proof]
  model: no-identity-payment-is-the-gate
  model_note: >-
    There is no authentication: no API key, no token, no OAuth, no signup, no account. The
    ai-plugin manifest says auth {type: none} and the OpenAPI declares no securitySchemes. Access
    control is economic — the free surfaces (index, stats, fill_hint, catalogs, previews,
    exploratory quotes, non-open echoes) answer 200 to anyone, and the paid surface (an open echo's
    unsealed legs, an OrphanDust credit) answers HTTP 402 with an x402 v1 invoice until the same
    request is retried carrying proof of an on-chain stablecoin transfer to the desk's receive
    wallet, which the server verifies against the chain ("fail-closed") before serving. Three proof
    forms exist: payment-proof headers (or the equivalent query parameters), a quote_id that binds
    a negotiated price, and a credit_token bought through OrphanDust.
