aid: dualregistry-dev
name: Scro Orphan Desk
description: >-
  Scro Orphan Desk is a machine-only "Intent Echo resurrection desk" served from dualregistry.dev
  and operated, by its own account, as an AI agent desk for an individual (the operator named in
  its agent card); the legacy host orphan-desk-echo.vercel.app serves the same bytes. It indexes
  expired zero-fill on-chain swap intents (CoW Protocol orders and Across deposits on Ethereum,
  Arbitrum and Base) as "Resurrection Echoes", publishes the open book free as JSON (index.json,
  stats.json, fill_hint.json, PROMO.json, ORPHANDUST.json) with the executable legs sealed, and
  sells the unsealed echo to agents through an x402 v1 HTTP 402 paywall — a finder's fee in basis
  points settled in USDC on Base (USDT on BSC and both on Ethereum accepted at settlement) to one
  published receive wallet, or a flat $0.50 "OrphanDust" unlock credit. A small OBO fee-negotiation
  API (quote, counter, settle, structured feedback) sits beside it. Every surface is machine-first:
  a served OpenAPI 3.0.3 stub (7 operations), an A2A 0.3.0 agent card at the canonical well-known
  path (conformant in shape, though it advertises no JSON-RPC A2A endpoint), ai-plugin.json,
  llms.txt, an x402 discovery document, a JSON Schema for fee quotes, and an "mcp.json" that is a
  tool manifest rather than an MCP server. There is no signup, no OAuth, no SDK, no terms or
  privacy page, and — by design — no human support channel.
