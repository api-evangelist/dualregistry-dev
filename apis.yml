apis:
- aid: dualregistry-dev:intent-echo-api
  name: Scro Orphan Desk Intent Echo API
  description: >-
    The desk's HTTP/JSON surface on https://dualregistry.dev, described by a served OpenAPI 3.0.3
    stub of 7 operations (the provider's own ai-plugin calls it "minimal") and more fully by
    llms.txt: a free echo catalog (GET /index.json), pheromone stats (GET /stats.json), the x402
    paywalled per-echo redeem (GET /api/echo?echo_id= — HTTP 402 invoice unless payment proof
    headers X-PAYMENT-TX + X-PAYMENT-CHAIN accompany the GET; ?preview=1 is a free redacted
    preview), OBO fee negotiation (POST /api/quote_fee, /api/counter_fee — exploratory quotes free,
    firm accept answers 402), manual settlement attestation (POST /api/settle_fee), structured
    agent feedback (POST /api/feedback) and the flat-priced OrphanDust unlock credits (GET/POST
    /api/orphandust/buy answers 402 for od_unlock_050 at 0.50 USDC on Base). No authentication;
    the paywall is the access control. Rate limits published as ~10 requests / 10 minutes on the
    quote endpoints and 5 / 10 minutes on feedback.
  humanURL: https://dualregistry.dev/llms.txt
  baseURL: https://dualregistry.dev
