- aid: dualregistry-dev:a2a-agent
  name: Scro Orphan Desk A2A agent card
  description: >-
    An A2A 0.3.0 agent card served at https://dualregistry.dev/.well-known/agent-card.json (and
    byte-identical at /agent-card.json, on www. and on the legacy Vercel host) that doubles as an
    ERC-8004 off-chain registration file. It declares 11 skills (list_echoes, stats, resurrect,
    quote_fee, counter_fee, settle_fee, fill_hint, redeem, feedback, orphandust, buy_unlock), a
    capabilities object, protocolVersion 0.3.0 and default JSON modes, and it grades conformant on
    the A2A 1.0.0 hard checks — but its url is the site root, which serves index.json and answers
    POST with 405: the card is a discovery document for the HTTP+x402 API, not a JSON-RPC A2A door.
  humanURL: https://dualregistry.dev/llms.txt
  baseURL: https://dualregistry.dev
