summary: >-
  Published in the docs and readable in the provider's own source, but not signalled on success:
  a fixed 10-minute window of 10 requests per IP+User-Agent hash on the three OBO quote endpoints,
  and 5 per 10 minutes on POST /api/feedback. Exhaustion is HTTP 429 with a Retry-After header
  (seconds to the end of the window) and a JSON body {status: reject, reason: rate_limited,
  retry_after, note "Max 10 OBO quote requests per 10 minutes per IP/UA. Retry after Ns.", skill}.
  No limit is published for the free GET surfaces (they are static JSON behind Cache-Control
  public, max-age=30) or for /api/echo, settle_fee and the OrphanDust routes. No X-RateLimit-* or
  IETF RateLimit header appears on any response, so an agent learns the budget from the docs and
  the exhaustion from the 429 only. The 429 was not provoked by this pipeline.
