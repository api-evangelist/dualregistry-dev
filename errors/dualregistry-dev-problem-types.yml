source: >-
  openapi/dualregistry-dev-openapi.yml (the declared 402s — derived first), upgraded from responses
  observed live and unauthenticated on https://dualregistry.dev on 2026-09-19 (404 echo_not_found,
  405 method_not_allowed x4, 402 x402_payment_required x2, 200 feedback self-description), the
  documented outcomes in https://dualregistry.dev/llms.txt and https://dualregistry.dev/fee_quote.schema.json,
  and the refusal reasons in the provider's published handler source
