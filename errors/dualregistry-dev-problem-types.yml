checked: '2026-09-19'
summary: >-
  Not RFC 9457. Every refusal is a plain application/json object {status: "reject", decision?:
  "reject", reason: <snake_case token>, note: <what to send instead>, skill: <which skill the
  route belongs to>} — the same envelope on 400, 404, 405, 422 and 429 — and the one status that
  is not a refusal, 402, is an x402 v1 invoice (type x402_payment_required) with the price, the
  accepts[] rail list and the exact retry instructions. The served OpenAPI declares only the 402s
  (on three operations) and 200s; nothing else is in the contract, so the catalog below comes from
  the wire and the provider's own source. Codes are stable snake_case tokens; the OrphanDust and
  quote-binding checks return {ok: false, reason} without a `status` field.
envelope:
  shape:
    status: '"reject" on every refusal'
    decision: '"reject" — present on the negotiation routes only'
    reason: 'a snake_case token to branch on'
    note: 'a sentence naming the body or method the route expects'
    skill: 'the agent-card skill the route belongs to (redeem, quote_fee, settle_fee, feedback, orphandust)'
  alternate_shape: '{ok: false, reason, ...} on OrphanDust credit checks and quote-binding checks'
  media_type: application/json; charset=utf-8
  problem_json: false
  request_id_header: 'none (x-vercel-id is the platform''s, not documented)'
  cors: 'Access-Control-Allow-Origin: * on every response'
declared_responses:
- status: 402
  declared_on_operations: 3
  operations: [redeemEcho, quoteFee, buyOrphanDustCredits]
  description_verbatim: x402 payment required / Payment required
  observed: true
  note: 'A price, not a decline. See problem type x402_payment_required.'
- status: 200
  declared_on_operations: 6
  note: 'Bare descriptions (Echo catalog, Stats, Full Echo, Counter or indicative quote, Receipt, Credits); no schemas.'
problem_types:
- code: x402_payment_required
  http_status: 402
  observed: true
  observed_on: ['GET /api/echo?echo_id=echo_a25e7551ed53c3018600f816', 'GET /api/orphandust/buy']
  title: Payment required (x402 v1 invoice)
  body: >-
    {schema_version, type: x402_payment_required, status: 402, x402Version: 1, echo_id?, sku?,
    amount, amount_usdc, receive_wallet, pay_to, accepts[] (scheme exact, network eip155:8453 |
    base, maxAmountRequired, resource, payTo, asset, maxTimeoutSeconds 600, extra), preferred
    {USDC on base, chain_id 8453, token, decimals 6}, accepted[] (USDC/base, USDT/bsc, USDC/ethereum,
    USDT/ethereum), fee {ask_bps, floor_bps, quoted_usdc}, cheaper_unlock {sku od_unlock_050,
    price_usdc 0.50, save_usdc}, pay_urls {...}, unlock {retry_get_with ...}, skip_feedback,
    ai_disclosure}
  headers: ['PAYMENT-REQUIRED (base64 x402 v1)', 'x-payment-required: true', x402-asset, x402-network, x402-pay-to, x402-price]
  remediation_verbatim: 'After paying, retry GET with headers X-PAYMENT-TX (0x…), X-PAYMENT-CHAIN (base|bsc|ethereum), optional X-PAYMENT-ASSET (USDC|USDT), optional X-PAYMENT-AMOUNT. Or query ?tx_hash=&chain=&asset=&amount=. Server RPC-verifies Transfer to fee wallet (fail-closed) then auto settle_fee.'
  skip_path_verbatim: 'If you skip this buy, POST /api/feedback {stage:paywall_402,outcome:too_expensive}. Do not invent a human channel.'
