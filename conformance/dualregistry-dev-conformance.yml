checked: '2026-09-19'
summary: >-
  Scro Orphan Desk conforms to the agent-payments and agent-discovery standards its market runs on
  and declares them IN THE CONTRACT and on the wire: x402 v1 (the OpenAPI declares "402: x402
  payment required" on three operations, /.well-known/x402 publishes the accepts[] set, and a live
  402 carries the PAYMENT-REQUIRED header whose base64 body is the x402 v1 {x402Version, accepts[]}
  object with scheme exact, CAIP-2 network eip155:8453, the USDC asset contract and payTo), an A2A
  0.3.0 agent card at the canonical path (shape-conformant; no JSON-RPC door), an ERC-8004
  registration-v1 file (off-chain only, by its own statement), CAIP-2 chain identifiers, OpenAPI
  3.0.3, JSON Schema 2020-12 for the fee-quote messages, ai-plugin.json and llms.txt. It conforms
  to none of the classic HTTP conventions the rubric also asks about: no OAuth 2.0 / OIDC (no
  identity at all), no RFC 9457 problem details (a custom {status, reason, note, skill} envelope),
  no RFC 9116 security.txt, no RFC 8594 Sunset, no IETF RateLimit headers (429 + Retry-After only),
  no pagination or idempotency contract. No certification or compliance programme is published,
  so no Compliance pointer is emitted.
standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    https://dualregistry.dev/openapi.json returns "openapi": "3.0.3" anonymously — 7 operations over
    6 paths, servers[] https://dualregistry.dev, info.title "Scro Orphan Desk API" 1.2.0. One
    validity defect: GET /api/orphandust/buy has no responses object (required by 3.0.3); recorded
    in the overlay, not repaired in the original.
  location: openapi/_original/dualregistry-dev-openapi.json
- id: x402-v1
  conforms: true
  domain_standard: true
  evidence: >-
    CONTRACT: the OpenAPI declares "402": "x402 payment required" on GET /api/echo, POST
    /api/quote_fee and POST /api/orphandust/buy. DISCOVERY: GET https://dualregistry.dev/.well-known/x402
    -> 200 {x402Version: 1, payTo, networks [eip155:8453, base], resources[1], accepts[2] {scheme
    exact, network eip155:8453, maxAmountRequired "500000", asset 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
    (USDC), payTo, maxTimeoutSeconds 600, extra {name USDC, version 2, chainId 8453}}}. WIRE:
    GET https://dualregistry.dev/api/echo?echo_id=echo_a25e… -> HTTP 402 with header
    PAYMENT-REQUIRED: <base64 of {"x402Version":1,"accepts":[…]}>, x-payment-required: true,
    x402-asset USDC, x402-network eip155:8453, x402-pay-to, x402-price 0.50, and a JSON body of
    type x402_payment_required carrying the same accepts[]. Payment proof is carried back on the
    retry as X-PAYMENT-TX + X-PAYMENT-CHAIN (or the generic X-PAYMENT); the provider's
    verify_payment.js RPC-verifies the ERC-20 Transfer ("fail-closed").
  location: 'openapi/dualregistry-dev-openapi.yml#/paths/~1api~1echo/get/responses/402; well-known/dualregistry-dev-x402.json'
  note: 'x402 v1 shape (accepts[] with maxAmountRequired), not v2. The card''s x402Support: true and x402_paywall block restate it.'
- id: a2a-agent-card
  conforms: true
  domain_standard: true
  evidence: >-
    /.well-known/agent-card.json, protocolVersion "0.3.0", capabilities object, skills[11] —
    grade conformant on the A2A 1.0.0 hard checks (a2a/dualregistry-dev-a2a.yml). No JSON-RPC
    endpoint: url is the site root and POST answers 405. Conformance of the CARD, not of a door.
  location: a2a/dualregistry-dev-agent-card.json
- id: erc-8004-registration-v1
  conforms: partial
  domain_standard: true
  evidence: >-
