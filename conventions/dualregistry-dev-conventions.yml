money_units:
  rule: 'Amounts on the desk''s own fields are decimal strings in USD-stable units ("2.49", "0.50"); the x402 accepts[].maxAmountRequired is the integer atomic form ("500000" = 0.50 USDC at 6 decimals). USDT on BSC has 18 decimals (accepted[] states decimals per rail).'
  fee_math: 'ask_bps / floor_bps of notional_usd; promo floor $0.25 / cap $250; default floor $1 / cap $500 (PROMO.json)'
